name: agentic
services:
  master:
    container_name: master
    platform: linux/amd64
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: agentic-proxy:latest
    restart: unless-stopped
    command: ["--config-file", "/opt/agentic/proxy/config.json"]
    ports:
      - "4500:4500"
    volumes:
      - ./config.json:/opt/agentic/proxy/config.json:ro
      - socket-worker-1:/opt/agentic/worker-1:ro
      - socket-worker-2:/opt/agentic/worker-2:ro

  worker-1:
    container_name: codex-worker-1
    platform: linux/amd64
    build:
      context: ./codex
      dockerfile: Dockerfile
    image: agentic-codex:latest
    restart: unless-stopped
    depends_on:
      - master
    entrypoint: ["/bin/sh", "/container-entrypoint.sh"]
    command: ["--listen", "unix:///opt/agentic/app-server.sock", "--remote-control"]
    volumes:
      - ./codex/container-entrypoint.sh:/container-entrypoint.sh:ro
      - ./data/worker-1:/persist
      - socket-worker-1:/opt/agentic

  worker-2:
    container_name: codex-worker-2
    platform: linux/amd64
    build:
      context: ./codex
      dockerfile: Dockerfile
    image: agentic-codex:latest
    restart: unless-stopped
    depends_on:
      - master
    entrypoint: ["/bin/sh", "/container-entrypoint.sh"]
    command: ["--listen", "unix:///opt/agentic/app-server.sock", "--remote-control"]
    volumes:
      - ./codex/container-entrypoint.sh:/container-entrypoint.sh:ro
      - ./data/worker-2:/persist
      - socket-worker-2:/opt/agentic

volumes:
  socket-worker-1: {}
  socket-worker-2: {}

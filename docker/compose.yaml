name: agentic
services:
  master:
    container_name: master
    platform: linux/amd64
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: agentic-proxy:latest
    restart: unless-stopped
    ports:
      - "4500:4500"
    networks:
      - network-worker-1
      - network-worker-2

  worker-1:
    container_name: codex-worker-1
    platform: linux/amd64
    build:
      context: ./codex
      dockerfile: Dockerfile
    image: agentic-codex:latest
    restart: unless-stopped
    networks:
      - network-worker-1
    depends_on:
      - master
    entrypoint: ["/bin/sh", "/container-entrypoint.sh"]
    command: ["--listen", "ws://0.0.0.0:4500", "--remote-control"]
    volumes:
      - ./codex/container-entrypoint.sh:/container-entrypoint.sh:ro
      - ./data/worker-1:/persist

  worker-2:
    container_name: codex-worker-2
    platform: linux/amd64
    build:
      context: ./codex
      dockerfile: Dockerfile
    image: agentic-codex:latest
    restart: unless-stopped
    networks:
      - network-worker-2
    depends_on:
      - master
    entrypoint: ["/bin/sh", "/container-entrypoint.sh"]
    command: ["--listen", "ws://0.0.0.0:4500", "--remote-control"]
    volumes:
      - ./codex/container-entrypoint.sh:/container-entrypoint.sh:ro
      - ./data/worker-2:/persist

networks:
  network-worker-1: {}
  network-worker-2: {}
